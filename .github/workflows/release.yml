name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry-run:
        description: "Dry run (skip npm publish & GitHub release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write      # push version commit + tag + create release
  id-token: write      # npm provenance

jobs:
  # ───────────────────────────────────────────────────────
  #  Gate: run full CI checks before releasing
  # ───────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    environment: gemini
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      SELF_HEAL: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:heal

  # ───────────────────────────────────────────────────────
  #  Release: bump version → publish → GitHub release
  # ───────────────────────────────────────────────────────
  release:
    name: Publish to npm
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for changelog
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          # Bump version in package.json, commit, and tag
          NEW_VERSION=$(npm version ${{ inputs.bump }} -m "chore(release): v%s")
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "### 📦 Version bump: ${NEW_VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run 2>&1 | tee /tmp/pack-output.txt

      - name: Push version commit and tag
        if: ${{ inputs.dry-run == false }}
        run: |
          git push origin HEAD
          git push origin ${{ steps.version.outputs.version }}

      - name: Publish to npm
        if: ${{ inputs.dry-run == false }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ inputs.dry-run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NUMBER="${VERSION#v}"

          # Prefer the hand-written CHANGELOG section for this version; fall
          # back to commit subjects if there isn't one.
          awk -v ver="$NUMBER" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "No CHANGELOG entry for $NUMBER — falling back to commit log."
            PREV_TAG=$(git tag --sort=-v:refname | grep -v "$VERSION" | head -1)
            {
              echo "## What's Changed"
              echo ""
              if [ -n "$PREV_TAG" ]; then
                git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | head -50
              else
                git log --pretty=format:"- %s (%h)" --no-merges -20
              fi
              echo ""
            } > /tmp/notes.md
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "**Install:** \`npm install healwright@${NUMBER}\`"
          } >> /tmp/notes.md

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/notes.md \
            --verify-tag

          echo "### 🚀 Released $VERSION" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$VERSION" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: ${{ inputs.dry-run == true }}
        run: |
          echo "### 🏜️ Dry run complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version would be: **${{ steps.version.outputs.version }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Package contents:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/pack-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Reset the version bump so it doesn't affect future runs
          git reset --hard HEAD~1
          git tag -d ${{ steps.version.outputs.version }} || true
