<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Geologica:slnt,wght,CRSV,SHRP@-12..0,100..900,0..1,0..100&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--muted) 14%, transparent) 1px, transparent 0) 0 0 / 24px 24px,
      radial-gradient(900px 520px at 78% 120%, color-mix(in srgb, var(--heal) 16%, transparent), transparent 70%),
      var(--night);
  }
  .card { box-sizing: border-box; width: 1280px; height: 640px; padding: 60px 76px 64px; display: flex; flex-direction: column; }
  .b-brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
  .b-brand img { width: 38px; height: auto; }
  .b-title { position: relative; margin: auto 0 0; font-size: 104px; line-height: .98; font-weight: 700; letter-spacing: -.045em; width: max-content; }
  .b-title .title-half { display: block; }
  .b-title .title-real { color: transparent; }
  .b-title .title-top { transform: translate(-.012em, -.01em); }
  .b-title .title-bottom { transform: translate(.012em, .01em); }
  .b-seam { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .b-seam polyline { fill: none; stroke: var(--heal); stroke-width: 3; stroke-linejoin: round; filter: drop-shadow(0 0 7px color-mix(in srgb, var(--heal) 80%, transparent)); }
  .b-seam line { stroke: var(--heal); stroke-width: 2.4; stroke-linecap: round; }
  .b-sub { margin: 30px 0 0; color: var(--muted); font-size: 30px; letter-spacing: -.01em; }
  .b-row { display: flex; align-items: center; gap: 28px; margin-top: 34px; }
  .b-pill { display: inline-flex; align-items: center; gap: 14px; height: 56px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--rim-hi); background: var(--deep); font: 19px var(--mono); font-stretch: 80%; }
  .b-pill span { color: var(--heal); }
  .b-prov { color: var(--muted); font-size: 20px; }
  .b-prov b { color: var(--text); font-weight: 560; }
</style>
</head>
<body>
  <div class="card">
    <div class="b-brand"><img src="owl.png" alt=""> Healwright</div>
    <h1 class="b-title" id="t">
      <span class="title-real">Your selector broke.<br>Your test didn't.</span>
      <span class="title-half title-top" style="position:absolute;inset:0">Your selector broke.<br>Your test didn't.</span>
      <span class="title-half title-bottom" style="position:absolute;inset:0">Your selector broke.<br>Your test didn't.</span>
      <svg class="b-seam" id="seam"></svg>
    </h1>
    <p class="b-sub">Self-healing locators for Playwright</p>
    <div class="b-row">
      <div class="b-pill"><span>$</span>npm install healwright</div>
      <div class="b-prov">Works with <b>OpenAI</b>, <b>Claude</b>, <b>Gemini</b> or a local <b>Ollama</b> model</div>
    </div>
  </div>
  <script>
    // Same seam as the site headline, drawn in pixels so the sutures stay square.
    document.fonts.ready.then(() => {
      const NS = 'http://www.w3.org/2000/svg';
      const t = document.getElementById('t'), svg = document.getElementById('seam');
      const W = t.offsetWidth, H = t.offsetHeight;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const pts = [[0,37],[9,46],[20,40],[31,51],[43,45],[55,57],[66,52],[78,63],[89,57],[100,64]].map(([x,y]) => [x/100*W, y/100*H]);
      const pl = document.createElementNS(NS, 'polyline');
      pl.setAttribute('points', pts.map(p => p.join(',')).join(' '));
      svg.appendChild(pl);
      const len = pl.getTotalLength();
      for (let s = 14; s < len - 7; s += 22) {
        const p = pl.getPointAtLength(s), q = pl.getPointAtLength(Math.min(len, s + 1));
        let tx = q.x - p.x, ty = q.y - p.y; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
        const ax = -ty * .87 + tx * .5, ay = tx * .87 + ty * .5, k = 9;
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', p.x - ax * k); l.setAttribute('y1', p.y - ay * k);
        l.setAttribute('x2', p.x + ax * k); l.setAttribute('y2', p.y + ay * k);
        svg.appendChild(l);
      }
      document.body.dataset.ready = '1';
    });
  </script>
</body>
</html>
